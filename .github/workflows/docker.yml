name: Docker Image

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Auth.json"
      - "requirements.txt"
      - "run.sh"
      - "subber"
      - "upd_schedule.py"
      - "i18n.py"
      - "youtube-dl-server.py"
      - "compose.yaml"
      - "bottle_websocket/**"
      - "static/**"
      - ".github/workflows/docker.yml"
  push:
    tags:
      - "v*"
      - "*.*.*"
      - "[0-9][0-9].[0-9][0-9][0-9][0-9]"
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Auth.json"
      - "requirements.txt"
      - "run.sh"
      - "subber"
      - "upd_schedule.py"
      - "i18n.py"
      - "youtube-dl-server.py"
      - "compose.yaml"
      - "bottle_websocket/**"
      - "static/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: modenaf360/youtube-dl-nas
  GHCR_IMAGE: ghcr.io/hyeonsangjeon/youtube-dl-nas

jobs:
  smoke:
    name: Run Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: youtube-dl-nas:smoke
          cache-from: type=gha,scope=runtime-smoke
          cache-to: type=gha,mode=max,scope=runtime-smoke

      - name: Start container and verify runtime
        run: |
          mkdir -p "$RUNNER_TEMP/ydlnas-downloads" "$RUNNER_TEMP/ydlnas-state"
          docker run -d --name youtube-dl-nas-smoke \
            -p 127.0.0.1:18080:8080 \
            -e MY_ID=smoke \
            -e MY_PW=smoke-password \
            -e TERMS_ACCEPTED=Y \
            -e YTDLP_AUTO_UPDATE=false \
            -e NLPTUTTI_AUTO_UPDATE=false \
            -v "$RUNNER_TEMP/ydlnas-downloads:/downfolder" \
            -v "$RUNNER_TEMP/ydlnas-state:/usr/src/app/metadata" \
            youtube-dl-nas:smoke

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health > "$RUNNER_TEMP/health.json"; then
              break
            fi
            sleep 2
          done

          python - <<'PY'
          import json
          import os

          path = os.path.join(os.environ["RUNNER_TEMP"], "health.json")
          with open(path, encoding="utf-8") as health_file:
              health = json.load(health_file)
          assert health["status"] == "ok", health
          assert health["app"] == "youtube-dl-nas", health
          assert health["storage"]["state"] in {"ok", "warning", "critical"}, health
          PY
          curl --fail --silent --show-error --location http://127.0.0.1:18080/ | grep -q "youtube-dl NAS"

      - name: Show container logs on failure
        if: failure()
        run: docker logs youtube-dl-nas-smoke || true

      - name: Remove smoke container
        if: always()
        run: docker rm -f youtube-dl-nas-smoke >/dev/null 2>&1 || true

  docker:
    name: Build Docker image
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
